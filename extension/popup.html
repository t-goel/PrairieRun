<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>PrairieRun</title><link rel="stylesheet" href="popup.css" /></head>
  <body>
    <main>
      <p class="eyebrow">PrairieRun</p>
      <h1>Assignment calendar</h1>
      <p id="context" class="muted">Checking the active PrairieLearn page…</p>
      <p class="muted">PrairieRun scans automatically when PrairieLearn opens and syncs Google Calendar at least once every 24 hours.</p>
      <div class="settings-card">
        <label for="completion-threshold">Complete above <input id="completion-threshold" type="number" min="0" max="100" step="1" value="95" />%</label>
        <label for="notification-lead-hours">Notify me <input id="notification-lead-hours" type="number" min="0" max="168" step="0.25" value="4" /> hours before due</label>
      </div>
      <button id="reset-data" class="secondary">Clear test data</button>
    </main>
    <script src="compat.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
