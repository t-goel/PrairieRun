<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrairieRun</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header class="page-head">
        <h1 class="brand">PrairieRun</h1>
      </header>

      <div class="page-grid">
        <div class="page-col page-col--left">
          <section class="card settings-card" id="output-settings">
            <h2>Reminders</h2>
            <div class="field-row">
              <label for="completion-threshold">Complete above <input id="completion-threshold" type="number" min="0" max="100" step="1" value="95" />%</label>
              <label for="notification-lead-hours">Notify <input id="notification-lead-hours" type="number" min="0" max="168" step="0.25" value="4" /> hours before</label>
            </div>
          </section>

          <section class="card" id="sources">
            <div class="sources-head">
              <h2>Sources</h2>
              <button id="sync-now" class="secondary sync-now" type="button">Sync now</button>
            </div>
            <p id="sync-status" class="muted" data-pr-sync-status hidden></p>
            <ul class="sources-list" id="sources-list"></ul>
          </section>

          <section class="card" id="course-links">
            <h2>Course links</h2>
          </section>
        </div>

        <div class="page-col page-col--right">
          <section class="card calendar-card" id="calendar-card">
            <h2>Calendar</h2>

            <div id="calendar-google" class="calendar-subsection">
              <div class="auth-row">
                <p id="auth-status" class="muted" hidden></p>
                <div class="auth-buttons">
                  <button id="auth-open-calendar" class="secondary icon-button" type="button" title="Open Google Calendar" aria-label="Open Google Calendar" hidden>
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <rect x="2" y="3" width="12" height="11" rx="1.5"></rect>
                      <line x1="2" y1="7" x2="14" y2="7"></line>
                      <line x1="5" y1="1.5" x2="5" y2="3.5"></line>
                      <line x1="11" y1="1.5" x2="11" y2="3.5"></line>
                    </svg>
                  </button>
                  <button id="auth-sync-calendar" class="secondary" type="button" hidden>Sync Calendar</button>
                  <button id="auth-connect" class="primary">Sign in with Google</button>
                  <button id="auth-disconnect" class="secondary" hidden>Sign out</button>
                </div>
              </div>
              <div id="calendar-sync-info" class="calendar-sync-info">
                <p id="calendar-sync-status" class="calendar-sync-status">No events synced to Google Calendar.</p>
                <p id="calendar-sync-details" class="muted calendar-sync-details"></p>
              </div>
              <p id="auth-error" class="muted error" hidden></p>
              <div class="field-row" id="google-calendar-layout" hidden>
                <label><input type="radio" name="google-calendar-layout" value="per_course" checked /> One calendar per course</label>
                <label><input type="radio" name="google-calendar-layout" value="single" /> One PrairieRun calendar</label>
              </div>
              <code id="auth-redirect" hidden></code>
              <button id="auth-copy-redirect" type="button" hidden>Copy</button>
            </div>

            <div id="calendar-feed" class="calendar-subsection"></div>
          </section>
          <section class="card" id="course-websites">
            <h2>Course websites</h2>
            <form id="course-websites-form" class="course-websites-form">
              <div class="course-websites-add">
                <input id="course-website-url" type="url" placeholder="https://courses.grainger.illinois.edu/cs425/fa2026/assignments.html" aria-label="UIUC course page URL" required />
                <button class="secondary" type="submit">Add</button>
              </div>
            </form>
            <ul id="course-websites-list" class="course-websites-list"></ul>
            <p id="course-websites-status" class="muted" hidden></p>
          </section>

          <section class="card" id="assignment-filters">
            <h2>Exclude Assignments</h2>
            <div class="prr-chip-box" id="filter-chips-box">
              <div class="prr-chip-list" id="filter-chips-list"></div>
              <input type="text" id="filter-keyword-input" class="prr-chip-input" placeholder="Type keyword and press Enter…" aria-label="Exclude keywords" />
            </div>
            <p id="filter-status" class="muted filter-status" hidden></p>
          </section>

          <section class="card" id="canvas-setup" hidden>
            <h2>Canvas</h2>
          </section>
        </div>

        <section class="card card--wide" id="assignment-digest">
          <h2>Digest</h2>
        </section>

      </div>
    </main>
    <script src="compat.js"></script>
    <script src="deadline-model.js"></script>
    <script src="view-utils.js"></script>
    <script src="source-registry.js"></script>
    <script src="source-courseweb.js"></script>
    <script src="ics-writer.js"></script>
    <script src="relay-push.js"></script>
    <script src="feed-auth.js"></script>
    <script src="options.js"></script>
    <script src="options-dashboard.js"></script>
    <script src="options-courseweb.js"></script>
    <script src="options-filters.js"></script>
    <script src="options-canvas.js"></script>
    <script src="options-courses.js"></script>
    <script src="options-feed.js"></script>
    <script src="options-digest.js"></script>
  </body>
</html>
